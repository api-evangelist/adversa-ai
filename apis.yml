name: Adversa AI
description: >-
  Adversa AI is an autonomous AI red-teaming and security company (founded 2021,
  Tel Aviv) that provides continuous security assessment for AI agents, LLMs, and
  GenAI applications. Its platform runs 300+ attack techniques — jailbreaks,
  prompt injection, and adversarial attacks — is OWASP- and NIST-mapped, runs
  its detection models on-prem so customer data is never exposed to external AI
  providers, and prioritizes every finding by real business impact with
  auto-generated remediation. Offerings include AI Threat Modelling, Continuous
  Security Assessment, Hardening & Remediation, and the AI Risk Quadrant (AIRQ)
  scoring framework. Adversa AI experts are co-leads and core members of
  NIST AI RMF, OWASP ASI, CoSAI, and CSA AI initiatives, and the company ships
  the open-source SecureClaw plugin/skill for hardening OpenClaw agents.
